<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu de Navegação</title>
  <style>
    /* Reset básico e fundo escuro para simular o app */
    body {
      margin: 0;
      background-color: #06090f; /* Fundo do app */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 100vh;
    }

    /* Contêiner da barra de navegação */
    .bottom-nav {
      background-color: #0f141e; /* Cor da barra */
      width: 100%;
      border-top: 1px solid #1a202c;
      padding-top: 12px;
      padding-bottom: 28px; /* Espaço para a barra indicadora do iOS */
      display: flex;
      justify-content: space-around;
      position: relative;
    }

    /* Estilo de cada item (botão) */
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #717d91; /* Cor do texto inativo */
      font-size: 12px;
      gap: 4px;
      width: 64px;
    }

    /* Estado ativo (Início) */
    .nav-item.active {
      color: #00c49a; /* Verde/Ciano ativo */
    }

    /* Tamanho e cor base dos ícones */
    .icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* Cores específicas baseadas na sua imagem para os ícones inativos */
    .nav-item:not(.active) .icon-conta { fill: #3b82f6; } /* Azul */
    .nav-item:not(.active) .icon-fatura { fill: #e2e8f0; } /* Branco/Cinza claro */
    .nav-item:not(.active) .icon-pix { fill: #facc15; } /* Amarelo */
    .nav-item:not(.active) .icon-historico { fill: #e2e8f0; } /* Branco/Cinza claro */

    /* Barra indicadora (estilo iOS) na parte inferior */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 4px;
      background-color: #8c92a1;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Menu de Navegação -->
  <nav class="bottom-nav">
    
    <!-- Item 1: Início (Ativo) -->
    <a href="#" class="nav-item active">
      <svg class="icon icon-inicio" viewBox="0 0 24 24">
        <!-- Ícone com um detalhe alaranjado simulado usando SVG -->
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor" />
        <circle cx="12" cy="11" r="2" fill="#facc15" /> 
      </svg>
      <span>Início</span>
    </a>
    
    <!-- Item 2: Conta -->
    <a href="#" class="nav-item">
      <svg class="icon icon-conta" viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      <span>Conta</span>
    </a>

    <!-- Item 3: Fatura -->
    <a href="#" class="nav-item">
      <svg class="icon icon-fatura" viewBox="0 0 24 24">
        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
      </svg>
      <span>Fatura</span>
    </a>

    <!-- Item 4: Pix -->
    <a href="#" class="nav-item">
      <svg class="icon icon-pix" viewBox="0 0 24 24">
        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
      </svg>
      <span>Pix</span>
    </a>

    <!-- Item 5: Histórico -->
    <a href="#" class="nav-item">
      <svg class="icon icon-historico" viewBox="0 0 24 24">
        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
      <span>Histórico</span>
    </a>

    <!-- Barra do iOS -->
    <div class="home-indicator"></div>
  </nav>

</body>
</html>
