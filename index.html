<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Nubank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #f5f5f7;
            height: 100vh;
            max-height: 840px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            border-radius: 20px;
            overflow: hidden;
        }

        /* Header */
        .header {
            background-color: #820AD1;
            color: white;
            padding: 24px 20px 20px 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-profile {
            width: 44px;
            height: 44px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-icons {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .user-greeting {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .editable-field {
            outline: none;
            border-radius: 4px;
            padding: 2px 4px;
            display: inline-block;
        }

        .editable-field:focus {
            background-color: rgba(255,255,255,0.25);
        }

        /* Content */
        .content {
            padding: 16px 20px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #111;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 1.4rem;
            font-weight: 700;
            color: #111;
        }

        .balance-hidden {
            width: 120px;
            height: 24px;
            background-color: #e2e2e8;
            border-radius: 4px;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            cursor: pointer;
            border: none;
            background: none;
        }

        .action-icon {
            width: 60px;
            height: 60px;
            background-color: #efeff4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            font-weight: bold;
            color: #820AD1;
        }

        .action-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #111;
        }

        /* Cartão Virtual */
        .my-cards {
            background-color: #efeff4;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: #111;
            margin-bottom: 16px;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        /* Extrato */
        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #111;
            margin: 16px 0 10px 0;
        }

        .transaction-list {
            background-color: white;
            border-radius: 16px;
            padding: 8px 16px;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f5;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-details p {
            font-size: 0.85rem;
            font-weight: 600;
            color: #111;
        }

        .transaction-details span {
            font-size: 0.75rem;
            color: #666;
        }

        .transaction-value {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .value-positive { color: #00875a; }
        .value-negative { color: #111; }

        /* Modais */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: white;
            width: 85%;
            border-radius: 16px;
            padding: 20px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #666;
        }

        .virtual-card-box {
            background: linear-gradient(135deg, #820AD1 0%, #4D067A 100%);
            border-radius: 12px;
            padding: 16px;
            color: white;
            margin: 12px 0;
        }

        .vc-number {
            font-size: 1rem;
            letter-spacing: 2px;
            margin: 16px 0;
            font-family: monospace;
        }

        .vc-bottom {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .btn-submit {
            width: 100%;
            background-color: #820AD1;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <div class="user-profile">
                    👤
                </div>
                <div class="header-icons">
                    <button class="icon-btn" id="toggle-eye" title="Ocultar/Mostrar Saldo">👁️</button>
                </div>
            </div>
            <div class="user-greeting">
                Olá, <span contenteditable="true" class="editable-field" id="user-name">Usuário</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- Saldo -->
            <div class="card">
                <div class="card-header">
                    <span>Conta</span>
                    <span>></span>
                </div>
                <div class="balance-amount" id="balance-value">
                    R$ <span contenteditable="true" class="editable-field" id="raw-balance">1.250,40</span>
                </div>
                <div class="balance-hidden hidden" id="balance-hidden"></div>
            </div>

            <!-- Botões Rápido -->
            <div class="quick-actions">
                <button class="action-item" id="btn-pix">
                    <div class="action-icon">❖</div>
                    <span class="action-label">Pix</span>
                </button>
                <button class="action-item">
                    <div class="action-icon">║▌</div>
                    <span class="action-label">Pagar</span>
                </button>
                <button class="action-item">
                    <div class="action-icon">⇄</div>
                    <span class="action-label">Transferir</span>
                </button>
            </div>

            <!-- Botão Cartão Virtual -->
            <button class="my-cards" id="btn-card">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <span style="color:#820AD1;">💳</span>
                    <span>Cartão Virtual</span>
                </div>
                <span>></span>
            </button>

            <!-- Fatura Cartão -->
            <div class="card">
                <div class="card-header">
                    <span>Cartão de crédito</span>
                    <span>></span>
                </div>
                <p style="font-size: 0.8rem; color: #666; margin-bottom: 4px;">Fatura atual</p>
                <div class="balance-amount" style="color: #00875a;">
                    R$ <span contenteditable="true" class="editable-field">380,20</span>
                </div>
            </div>

            <!-- Extrato -->
            <h3 class="section-title">Histórico de Transações</h3>
            <div class="transaction-list" id="transaction-list">
                <div class="transaction-item">
                    <div class="transaction-details">
                        <p contenteditable="true" class="editable-field">Supermercado Modelo</p>
                        <span>Hoje • Débito</span>
                    </div>
                    <span class="transaction-value value-negative">- R$ 145,90</span>
                </div>
            </div>
        </main>

        <!-- MODAL CARTÃO VIRTUAL -->
        <div class="modal-overlay hidden" id="card-modal">
            <div class="modal-card">
                <button class="modal-close" id="btn-close-card">✕</button>
                <h3 style="font-size: 1rem; color: #111;">Cartão Virtual</h3>
                <p style="font-size: 0.7rem; color: #666;">Clique para editar os valores:</p>

                <div class="virtual-card-box">
                    <div style="display: flex; justify-content: space-between;">
                        <span>⚡ Virtual</span>
                        <span style="font-weight: bold;">Mastercard</span>
                    </div>
                    <div class="vc-number">
                        <span contenteditable="true" class="editable-field">5502 8412 9031 4481</span>
                    </div>
                    <div class="vc-bottom">
                        <div>
                            <div style="opacity: 0.7; font-size: 0.6rem;">TITULAR</div>
                            <div contenteditable="true" class="editable-field" id="card-holder-name">USUÁRIO</div>
                        </div>
                        <div>
                            <div style="opacity: 0.7; font-size: 0.6rem;">VAL.</div>
                            <div contenteditable="true" class="editable-field">08/29</div>
                        </div>
                        <div>
                            <div style="opacity: 0.7; font-size: 0.6rem;">CVC</div>
                            <div contenteditable="true" class="editable-field">492</div>
                        </div>
                    </div>
                </div>
                <button class="btn-submit" id="btn-done-card">Fechar</button>
            </div>
        </div>

        <!-- MODAL PIX -->
        <div class="modal-overlay hidden" id="pix-modal">
            <div class="modal-card">
                <button class="modal-close" id="btn-close-pix">✕</button>
                <h3 style="font-size: 1rem; color: #111; margin-bottom: 10px;">Fazer / Receber Pix</h3>
                
                <div class="form-group">
                    <label for="pix-type">Operação</label>
                    <select id="pix-type">
                        <option value="send">Enviar Pix (Saída)</option>
                        <option value="receive">Receber Pix (Entrada)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pix-name">Nome da Pessoa / Empresa</label>
                    <input type="text" id="pix-name" placeholder="Ex: João da Silva">
                </div>
                <div class="form-group">
                    <label for="pix-amount">Valor (R$)</label>
                    <input type="number" id="pix-amount" placeholder="50.00">
                </div>

                <button class="btn-submit" id="btn-confirm-pix">Confirmar Pix</button>
            </div>
        </div>
    </div>

    <script>
        // Executa o script apenas após o carregamento da tela
        window.onload = function() {
            var toggleEye = document.getElementById('toggle-eye');
            var balanceValue = document.getElementById('balance-value');
            var balanceHidden = document.getElementById('balance-hidden');

            var btnPix = document.getElementById('btn-pix');
            var pixModal = document.getElementById('pix-modal');
            var btnClosePix = document.getElementById('btn-close-pix');
            var btnConfirmPix = document.getElementById('btn-confirm-pix');

            var btnCard = document.getElementById('btn-card');
            var cardModal = document.getElementById('card-modal');
            var btnCloseCard = document.getElementById('btn-close-card');
            var btnDoneCard = document.getElementById('btn-done-card');

            // Toggle Saldo
            toggleEye.onclick = function() {
                if (balanceValue.classList.contains('hidden')) {
                    balanceValue.classList.remove('hidden');
                    balanceHidden.classList.add('hidden');
                } else {
                    balanceValue.classList.add('hidden');
                    balanceHidden.classList.remove('hidden');
                }
            };

            // Modal Cartão
            btnCard.onclick = function() {
                var name = document.getElementById('user-name').innerText;
                document.getElementById('card-holder-name').innerText = name.toUpperCase();
                cardModal.classList.remove('hidden');
            };
            btnCloseCard.onclick = function() { cardModal.classList.add('hidden'); };
            btnDoneCard.onclick = function() { cardModal.classList.add('hidden'); };

            // Modal Pix
            btnPix.onclick = function() { pixModal.classList.remove('hidden'); };
            btnClosePix.onclick = function() { pixModal.classList.add('hidden'); };

            // Executar Pix
            btnConfirmPix.onclick = function() {
                var type = document.getElementById('pix-type').value;
                var name = document.getElementById('pix-name').value || 'Pix';
                var amount = parseFloat(document.getElementById('pix-amount').value);

                if (isNaN(amount) || amount <= 0) {
                    alert('Digite um valor válido!');
                    return;
                }

                var rawBalanceElem = document.getElementById('raw-balance');
                var currentVal = parseFloat(rawBalanceElem.innerText.replace('.', '').replace(',', '.'));
                if (isNaN(currentVal)) currentVal = 0;

                var isReceive = (type === 'receive');
                var newVal = isReceive ? (currentVal + amount) : (currentVal - amount);
                
                rawBalanceElem.innerText = newVal.toLocaleString('pt-BR', { minimumFractionDigits: 2 });

                // Extrato
                var transactionList = document.getElementById('transaction-list');
                var newItem = document.createElement('div');
                newItem.className = 'transaction-item';
                var sign = isReceive ? '+ R$' : '- R$';
                var valClass = isReceive ? 'value-positive' : 'value-negative';

                newItem.innerHTML = `
                    <div class="transaction-details">
                        <p contenteditable="true" class="editable-field">${isReceive ? 'Pix recebido - ' : 'Pix enviado - '}${name}</p>
                        <span>Agora • Pix</span>
                    </div>
                    <span class="transaction-value ${valClass}">${sign} ${amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</span>
                `;

                transactionList.insertBefore(newItem, transactionList.firstChild);

                document.getElementById('pix-name').value = '';
                document.getElementById('pix-amount').value = '';
                pixModal.classList.add('hidden');
            };
        };
    </script>
</body>
</html>
